name: WhatsApp Bulk Message Automation 
 
on: 
  schedule: 
    - cron: '30 6 * * *' 
  workflow_dispatch: 
 
jobs: 
  send-whatsapp: 
    runs-on: ubuntu-latest 
    steps: 
       - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with: 
        python-version: '3.10' 
    - name: Install dependencies 
      run: | 
        python -m pip install --upgrade pip 
        pip install selenium google-auth-oauthlib google-auth-httplib2 google-api-python-client pandas openpyxl 
    - name: Install Chrome 
      run: | 
        sudo apt-get update 
        sudo apt-get install -y chromium-browser chromium-chromedriver 
    - name: Create credentials 
      env: 
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }} 
      run: | 
        mkdir -p ~/.config 
        echo "$GOOGLE_CREDENTIALS" > ~/.config/google_credentials.json 
    - name: Run WhatsApp automation 
      env: 
        SHEET_ID: ${{ secrets.SHEET_ID }} 
        SHEET_NAME: ${{ secrets.SHEET_NAME }} 
        SHEET_GID: ${{ secrets.SHEET_GID }} 
      run: | 
        python app/app.py $SHEET_ID $SHEET_NAME $SHEET_GID 
